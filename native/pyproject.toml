[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pysuricata-core"
description = "Native streaming-statistics kernels for PySuricata"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alvaro Diez", email = "alvarodiez20@gmail.com" }]
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
]
dynamic = ["version"]
dependencies = ["numpy>=1.23"]

[project.urls]
Repository = "https://github.com/alvarodiez20/pysuricata"

[tool.maturin]
module-name = "pysuricata_core"
features = ["pyo3/extension-module"]
strip = true
