[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysuricata"
version = "0.1.5"
description = "Streaming EDA profiler: one pass over pandas or polars, bounded memory, a self-contained HTML report."
authors = [
    {name = 'Alvaro Diez', email = 'alvarodiez20@gmail.com'},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "eda",
  "exploratory-data-analysis",
  "profiling",
  "data-quality",
  "pandas",
  "polars",
  "streaming",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",

  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython"
]
dependencies = [
    # The ceiling is `<4`, not `<3`: pandas 3 works. A `<3.0` cap silently pulled
    # a pandas 3 environment back to 2.3.3 on install, and it was not defending a
    # real incompatibility -- forced to 3.0.5 with `--no-deps`, profile() and
    # summarize() both produce correct statistics.
    #
    # The python_version split stays, and it exists for the *floor* only: 2.2.3 is
    # the first pandas publishing cp313 wheels, so lowering that floor would let a
    # constrained resolver build 2.2.0 from source against a Python it never
    # supported. Same failure mode as the numpy floor below.
    "pandas>=2.0,<4;   python_version <  '3.13'",
    "pandas>=2.2.3,<4; python_version >= '3.13'",
    "numpy>=2.1; python_version >= '3.13'",
    # 2.3.3 is the first numpy publishing cp314 wheels. Without this floor the
    # resolver picks 2.1.3 on 3.14 and builds it from source against a Python it
    # never supported; the resulting binary computes uint64 arithmetic wrongly
    # for large arrays, which silently corrupts the hash sketches.
    "numpy>=2.3.3; python_version >= '3.14'",
    "markdown>=3.4.0",
]


[project.urls]
Homepage = "https://alvarodiez20.github.io/pysuricata/"
Documentation = "https://alvarodiez20.github.io/pysuricata/"
Repository = "https://github.com/alvarodiez20/pysuricata"
Changelog = "https://github.com/alvarodiez20/pysuricata/blob/main/CHANGELOG.md"
Issues = "https://github.com/alvarodiez20/pysuricata/issues"

[project.scripts]
pysuricata = "pysuricata.cli:main"

[project.optional-dependencies]
polars = [
    "polars>=1.34.0",
]
# psutil is not imported anywhere in `pysuricata/` -- it is used by the memory
# tests and by the recipes in docs/performance.md. It was declared as a runtime
# dependency, which cost more than it looks: psutil publishes no WASM wheel, so
# micropip could not resolve the package at all and the browser demo carried a
# hand-written mock distribution to get past it. Kept as an extra for anyone
# following those recipes.
system = [
    "psutil>=7.1.0",
]

[dependency-groups]
dev = [
    "aiohttp>=3.11.14",
    "coverage>=7.7.1",
    # test-only: exercises the DuckDB streaming path. Never a runtime dep --
    # the reader is duck-typed on fetch_record_batch, so nothing imports it.
    "duckdb>=1.0.0",
    "mkdocs-material>=9.6.18",
    "mkdocstrings>=0.30.0",
    "mkdocstrings-python>=1.18.0",
    "pyarrow>=17.0.0",  # test-only: exercises the pd.ArrowDtype inference branch
    # test-only: exercises `_read_excel`'s calamine path. Never a runtime dep --
    # `_read_excel` falls back to pandas' own per-format engines when this is
    # not installed, same as the browser demo's dependency-on-demand story.
    "python-calamine>=0.2",
    # test-only: writes the .xlsx fixtures `_read_excel` reads. Not calamine,
    # which is read-only -- pandas needs a writer engine to create one.
    "openpyxl>=3.1",
    # test-only: tests/test_memory_stress.py and tests/test_complexity_analysis.py
    # measure RSS with it. Nothing under `pysuricata/` imports it.
    "psutil>=7.1.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "requests>=2.32.3",
    "ruff>=0.13.3",  # keep in sync with .pre-commit-config.yaml ruff rev
    "pre-commit>=3.6.2",
    "setuptools>=80.9.0",
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.0",
]
# Deliberately not in `dev`. The layout acceptance criteria (#124) need a real
# browser, and pulling a ~300 MB Chromium into every test job to run 31 cases
# would slow all six of them down. The `layout` job in ci.yml syncs this group
# and installs the browser; everywhere else the cases skip themselves.
browser = [
    "playwright>=1.47",
    # web/e2e.py decodes a demo screenshot to assert it is not blank.
    "pillow>=10.0",
]

[tool.setuptools]
include-package-data = true
packages = [
    "pysuricata",
    "pysuricata.accumulators",
    "pysuricata.compute",
    "pysuricata.compute.adapters",
    "pysuricata.compute.analysis",
    "pysuricata.compute.core",
    "pysuricata.compute.orchestration",
    "pysuricata.compute.processing",
    "pysuricata.io",
    "pysuricata.render",
    "pysuricata.static",
    "pysuricata.static.css",
    "pysuricata.static.images",
    "pysuricata.static.js",
    "pysuricata.templates"
]

[tool.setuptools.package-data]
pysuricata = [
    "py.typed",
    "templates/*.html",
    "static/css/*.css",
    # The report embeds the mark as inline SVG; it no longer reads a PNG at all.
    # logo_suricata_transparent.png stays in the package directory anyway,
    # because the README links it by raw GitHub URL and moving it would break
    # the image on every already-published PyPI page. `include-package-data`
    # sweeps in everything under the package regardless of the globs here, so
    # this list documents intent rather than enforcing it.
    "static/images/*.svg",
    "static/images/*.png",
    "static/images/*.ico",
    "static/js/*.js"
    ]

[tool.ruff]
target-version = "py310"
line-length = 88
# Notebooks are teaching material: pyupgrade-style rewrites hurt readability there.
# Declared here (not only in .pre-commit-config.yaml) so pre-commit and CI agree.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "E402",  # module-level import not at top — intentional in __init__, config, render
    "E731",  # lambda assignment — used for legacy aliases in format_utils
    "E741",  # ambiguous variable name — used in list comprehensions (l in labels)
    "B008",  # do not perform function calls in argument defaults
    "B028",  # stacklevel in warnings — render modules use default
    "C416",  # unnecessary dict comprehension — readability preference
    "C901",  # too complex
    "UP007", # Union type hint — keep for Python 3.10 compat
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "B007", "F841"]
"pysuricata/render/*" = ["B007", "F841"]  # computed-but-unused vars kept for readability

[tool.ruff.lint.isort]
known-first-party = ["pysuricata"]

[tool.pytest.ini_options]
# The repo root on sys.path, so tests can import the benchmark harness the same
# way `python -m benchmarks.end_to_end` does.
pythonpath = ["."]
markers = [
    "benchmark: marks tests as slow benchmarks (deselect with '-m \"not benchmark\"')",
    # Layout acceptance criteria (#124) measured in a real browser. They skip
    # when Playwright is absent, so the ordinary run stays pure Python; the
    # `layout` job in ci.yml installs Chromium and runs them for real.
    "browser: marks tests that need Playwright and a Chromium build",
]
# An xfail that starts passing is a fixed bug with a stale marker, and it must
# not pass silently. With this on, XPASS fails the build and the marker has to
# be removed deliberately. Note a marker written with an explicit strict=False
# still opts out -- don't write one.
xfail_strict = true

[tool.uv]
constraint-dependencies = [
    "click!=8.3.0",
]
