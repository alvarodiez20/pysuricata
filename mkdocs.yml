site_name: PySuricata
site_description: Exploratory data analysis reports for pandas DataFrames
site_url: https://alvarodiez20.github.io/pysuricata/
repo_name: alvarodiez20/pysuricata
repo_url: https://github.com/alvarodiez20/pysuricata
edit_uri: blob/main/docs/

theme:
  name: material
  logo: assets/favicon.ico
  favicon: assets/favicon.ico
  features:
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - toc.integrate
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    # Light mode - Nature/Forest theme
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode - Night Forest theme
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  # An external link, so it becomes a tab on every page rather than a link the
  # reader has to go back to the landing page to find. `index.md` already offers
  # the demo twice, which serves someone who arrives at the front door and nobody
  # who lands on a stats page from a search result.
  - Live Demo: https://pysuricata.pages.dev
  - Getting Started:
      - Why PySuricata?: why-pysuricata.md
      - Installation: install.md
      - Quick Start: quickstart.md
      - Examples Gallery: examples.md
  - User Guide:
      - Basic Usage: usage.md
      - Configuration: configuration.md
      - Advanced Features: advanced.md
      - Arrow, Parquet and DuckDB: data-sources.md
      - Command Line: cli.md
      - Gating CI on drift: data-checks.md
      - Comparing two datasets: comparing.md
      - Performance Tips: performance.md
  - Technical Reference:
      - API Reference: api.md
      - Generated Reference: reference.md
      - "summarize() schema": summary-schema.md
      - Complexity Analysis: complexity-analysis.md
      - Statistical Methods:
          - Overview: stats/overview.md
          - Numeric Analysis: stats/numeric.md
          - Categorical Analysis: stats/categorical.md
          - DateTime Analysis: stats/datetime.md
          - Boolean Analysis: stats/boolean.md
      - Advanced Analytics:
          - Correlations: analytics/correlations.md
          - Missing Values: analytics/missing-values.md
          - Duplicate Detection: analytics/duplicates.md
          - Data Quality: analytics/quality.md
      - Algorithms:
          - Streaming Statistics: algorithms/streaming.md
          - Sketch Algorithms: algorithms/sketches.md
          - Reservoir Sampling: algorithms/sampling.md
  - Architecture:
      - Overview: architecture.md
      - Architecture Diagrams: architecture-diagrams.md
      - Sequence Diagrams: sequence-diagrams-complexity.md
  - Contributing: contributing.md
  - FAQ: faq.md
  - About:
      - About Suricatas: about-suricatas.md
      - "ADR: memory budget": adr/memory-budget.md
      - Versioning: versioning.md
      - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Lets docs/changelog.md include the root CHANGELOG.md verbatim.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Working notes that live under docs/ for convenience but are not documentation:
# a finished plan, its test harness, a superseded audit and the designer handoff.
# They are kept as a record of how the work was done and are not published.
exclude_docs: |
  internal/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            heading_level: 2

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alvarodiez20

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/figures.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
