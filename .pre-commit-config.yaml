# See https://pre-commit.com for more information
repos:
  # ── Standard file-hygiene hooks ──────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Generated reports are excluded: rewriting them here would make the
      # committed file differ from what regenerate_example_report.py emits.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^docs/assets/.*\.html$'
      - id: end-of-file-fixer
        exclude: '^docs/assets/.*\.html$'
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      # 500 -> 1500 for the demo dataset (#150). The guard is against adding a
      # large file by *accident*; the one deliberate exception is
      # `docs/assets/bike_sharing.csv` at 1,194 KB, which is vendored so no CI
      # job ever fetches it. It cannot be smaller and still do its job: two
      # calendar years are what make the datetime card's year panel render at
      # all, and the floor for two years of hourly rows is ~1,150 KB even with
      # minute-precision timestamps and two-decimal floats.
      - id: check-added-large-files
        args: [--maxkb=1500]
      # Work lands on main only through a reviewed PR, never a direct commit.
      - id: no-commit-to-branch
        args: [--branch, main]

  # ── Ruff: lint + format ──────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: '\.ipynb$'
      - id: ruff-format
        exclude: '\.ipynb$'

  # ── Tests ────────────────────────────────────────────────────
  # --no-sync is load-bearing. Without it `uv run` re-resolves and reinstalls
  # the project on every commit, against a tree pre-commit has partially
  # stashed -- which is slow, races the stash, and rewrites build metadata, so
  # pre-commit reports "files were modified by this hook" and aborts a commit
  # that had nothing wrong with it.
  #
  # The subset is the statistical core plus the invariants most likely to break
  # (chunk-invariance, RNG isolation, sketch gating). ~10s. The full suite and
  # the accuracy oracle run in CI; this is the tier that should catch a mistake
  # before it becomes a push.
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (accumulators + invariants)
        entry: >-
          uv run --no-sync pytest -q --no-header -p no:cacheprovider
          tests/test_accumulators_core.py
          tests/test_sketch_gating.py
          tests/test_extremes_and_monotonicity.py
          tests/test_datetime_vectorised.py
          tests/test_per_accumulator_rng.py
          tests/test_row_count_integrity.py
          tests/test_utils.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
