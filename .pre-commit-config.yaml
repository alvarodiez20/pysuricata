# See https://pre-commit.com for more information
repos:
  # ── Standard file-hygiene hooks ──────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Generated reports are excluded: rewriting them here would make the
      # committed file differ from what regenerate_example_report.py emits.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^docs/assets/.*\.html$'
      - id: end-of-file-fixer
        exclude: '^docs/assets/.*\.html$'
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]

  # ── Ruff: lint + format ──────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        exclude: '\.ipynb$'
      - id: ruff-format
        exclude: '\.ipynb$'

  # ── Tests (fast subset — no polars/benchmark deps) ──────────
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast)
        entry: uv run pytest tests/test_css_integrity.py tests/test_utils.py tests/test_svg_utils.py -q --no-header
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
