name: CI

on:
  # No `branches:` filter. Keyed on `main` only, a PR stacked on another PR
  # matched nothing and ran zero checks -- which is what happened to sixteen
  # of the redesign PRs until they were retargeted at `main` before merge.
  pull_request:
  # Every check this project relies on had only ever run against a *proposed*
  # merge, never against the result. A PR is tested against `main` as it was
  # when the branch was opened, so two PRs that are individually green can be
  # red together, and nothing would have noticed.
  #
  # `version-check` and `changelog-check` are deliberately not run here: both
  # diff against `origin/main`, so on a push to `main` they compare a commit
  # with itself and fail by construction. They are pre-merge gates by nature.
  push:
    branches: [ main ]

jobs:
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version was updated
        run: |
          # Get current version from pyproject.toml
          CURRENT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")

          # Get previous version from main branch
          git fetch origin main
          PREV_VERSION=$(git show origin/main:pyproject.toml | python -c "import sys, tomllib; print(tomllib.load(sys.stdin.buffer)['project']['version'])")

          echo "Current version: $CURRENT_VERSION"
          echo "Previous version: $PREV_VERSION"

          if [ "$CURRENT_VERSION" = "$PREV_VERSION" ]; then
            echo "⚠️  Warning: Version not updated in pyproject.toml"
            echo "Please update version from $PREV_VERSION to a new version"
            exit 1
          else
            echo "✓ Version updated: $PREV_VERSION → $CURRENT_VERSION"
          fi

  changelog-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changelog was updated
        run: |
          git fetch origin main
          if git diff origin/main -- CHANGELOG.md | grep -q '^+'; then
            echo "✓ Changelog has been updated"
          else
            echo "⚠️  Warning: CHANGELOG.md has not been updated"
            echo "Please add a changelog entry for your changes"
            echo "(docs/changelog.md includes this file; edit the root one)"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest -m "not benchmark" --cov=pysuricata --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up UV
        uses: astral-sh/setup-uv@v3

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Regenerate example report
        run: uv run python scripts/regenerate_example_report.py

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Upload example report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titanic-report-ci
          path: docs/assets/titanic_report.html
          if-no-files-found: warn
