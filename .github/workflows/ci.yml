name: CI

on:
  # No `branches:` filter. Keyed on `main` only, a PR stacked on another PR
  # matched nothing and ran zero checks -- which is what happened to sixteen
  # of the redesign PRs until they were retargeted at `main` before merge.
  pull_request:
  # Every check this project relies on had only ever run against a *proposed*
  # merge, never against the result. A PR is tested against `main` as it was
  # when the branch was opened, so two PRs that are individually green can be
  # red together, and nothing would have noticed.
  #
  # `version-check` and `changelog-check` are deliberately not run here: both
  # diff against `origin/main`, so on a push to `main` they compare a commit
  # with itself and fail by construction. They are pre-merge gates by nature.
  push:
    branches: [ main ]

jobs:
  version-check:
    # Validate a bump; do not demand one. The old rule -- every pull request
    # must bump or it cannot merge -- combined with publishing on every push to
    # main to make one merged PR exactly one PyPI release, unconditionally. The
    # version could not describe a change because it was incremented by the act
    # of merging. Publishing now happens on a tag, so this is free to be a
    # weaker rule that catches more: if you bump, the step has to be legal and
    # the changelog has to have a section for it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the version step is legal
        run: |
          git fetch origin main
          python scripts/check_version.py --base origin/main

  changelog-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changelog was updated
        run: |
          git fetch origin main
          if git diff origin/main -- CHANGELOG.md | grep -q '^+'; then
            echo "✓ Changelog has been updated"
          else
            echo "⚠️  Warning: CHANGELOG.md has not been updated"
            echo "Please add a changelog entry for your changes"
            echo "(docs/changelog.md includes this file; edit the root one)"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Run tests with coverage
        run: uv run pytest -m "not benchmark" --cov=pysuricata --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # The matrix above resolves pandas to whatever the lockfile pins, which is a
  # 2.x. The dependency ceiling says pandas 3 is supported, and until this job
  # existed that was an assumption -- one that was wrong in two ways at once:
  # pandas 3 defaults datetimes to `datetime64[us]` where 2 used `[ns]`, and it
  # parses `"T1"` as year 1, so a ticket column inferred as datetime.
  #
  # A separate job rather than a matrix entry: an `include:` whose keys match an
  # existing combination merges into that job instead of adding one, so a
  # `python-version: "3.12"` entry would have silently modified the 3.12 leg
  # rather than adding a pandas 3 leg.
  test-pandas3:
    runs-on: ubuntu-latest
    # `uv run` re-syncs the environment from the lockfile before running, which
    # silently undid the `uv pip install` below and put pandas 2 back -- the
    # first version of this job upgraded to 3.0.5 and then tested 2.3.3. The
    # assertion caught it, which is the whole reason it is written as an
    # assertion rather than a print.
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        # The one place a sync is wanted, so it opts out of UV_NO_SYNC.
        run: uv sync --all-extras
        env:
          UV_NO_SYNC: "0"

      - name: Force pandas 3
        run: |
          uv pip install --upgrade "pandas>=3,<4"
          uv run --no-sync python -c "
          import pandas, sys
          print('pandas', pandas.__version__)
          if pandas.__version__.split('.')[0] != '3':
              sys.exit('expected pandas 3, got ' + pandas.__version__)
          "

      - name: Run tests
        run: uv run --no-sync pytest -m "not benchmark" -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up UV
        uses: astral-sh/setup-uv@v3

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Regenerate example report
        run: uv run python scripts/regenerate_example_report.py

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Upload example report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titanic-report-ci
          path: docs/assets/titanic_report.html
          if-no-files-found: warn

  # The redesign's layout acceptance criteria (#124), measured in a real browser
  # rather than read off the issue. Its own job because Chromium is ~300 MB and
  # the other six jobs have no use for it; without this the cases skip.
  #
  # Measuring is the point, and measuring naively is how this goes wrong: the
  # header reads 53px against a 52px budget until you notice `getBoundingClient
  # Rect()` counts the 1px border, and every icon button reads 30x30 against a
  # 44x44 minimum until you notice the hit area is an absolutely positioned
  # `::after`. Both budgets are met. See the module docstring.
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --group browser

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run the layout acceptance criteria
        run: uv run pytest -m browser -q

      # The contact sheet is a review aid, never a gate: thirteen redesign
      # issues are *supposed* to change every pixel, so a pixel-equality check
      # would be disabled on the first phase and stay disabled. The structural
      # assertions above are the gate; these are how a human reviews a phase in
      # thirty seconds instead of thirty minutes.
      - name: Contact sheet
        if: always()
        continue-on-error: true
        run: uv run python scripts/contact_sheet.py

      - name: Upload contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-contact-sheet
          path: contact-sheet/
          if-no-files-found: warn
