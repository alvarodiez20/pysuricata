name: Docs Check

on:
  # Unfiltered by branch, so a stacked PR is covered too.
  pull_request:
    paths:
      - 'docs/**'
      # The README is checked by `benchmarks.check_docs` too (#151). Without it
      # here, editing only the README skips the very job that executes its
      # fences -- which is the drift this was added to stop.
      - 'README.md'
      - 'mkdocs.yml'
      - 'pysuricata/**/*.py'
      # A change to the checker must re-run it over everything it covers.
      # Otherwise a pull request that narrows what is checked -- or breaks it
      # outright -- is the one pull request the check does not run on.
      - 'benchmarks/check_docs.py'
      - 'scripts/build_docs_assets.py'
      - 'scripts/regenerate_example_report.py'
      # And on itself, for the same reason one step further out: editing the
      # trigger list is exactly the edit that most needs the job to run.
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up UV
        uses: astral-sh/setup-uv@v3

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Regenerate example report
        run: uv run python scripts/regenerate_example_report.py

      - name: Build docs (strict mode)
        run: uv run mkdocs build --strict

      # Executes every self-contained python fence and resolves every config
      # option and summary key against the live API. Renaming an option or
      # moving a summary key now fails the PR that did it, instead of leaving
      # the docs to drift -- which is how they accumulated 90 errors.
      - name: Check documentation against the API
        run: uv run python -m benchmarks.check_docs --strict

      # The generated figures must match the code that generates them.
      - name: Check generated doc assets are current
        run: uv run python scripts/build_docs_assets.py --check

      - name: Upload example report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titanic-report
          path: docs/assets/titanic_report.html
          if-no-files-found: warn
