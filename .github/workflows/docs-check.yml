name: Docs Check

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pysuricata/**/*.py'

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up UV
        uses: astral-sh/setup-uv@v3

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Regenerate example report
        run: uv run python scripts/regenerate_example_report.py

      - name: Build docs (strict mode)
        run: uv run mkdocs build --strict

      - name: Upload example report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titanic-report
          path: docs/assets/titanic_report.html
          if-no-files-found: warn
