name: Release and Publish

# Publishing happens when a version tag is pushed. Deliberately typed, once.
#
# It used to trigger on `push: branches: [main]`, which -- paired with
# `version-check` requiring a bump on every pull request -- made one merged PR
# exactly one PyPI release, unconditionally. A rewritten kernel and a fixed typo
# were the same size of event, so the version could not describe a change: it
# was incremented by the act of merging rather than by a judgement about what
# merged. Semantic versioning was not un-adopted, it was unreachable.
#
# To release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # A dry run: everything except publish and release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, without the leading v"
        required: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- guard ---
  # Cheap checks first, so a mistake costs seconds rather than an unpublishable
  # PyPI version. Nothing on PyPI can be replaced, only yanked.
  guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: The tag must match pyproject.toml
        run: |
          DECLARED=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$DECLARED" != "${{ steps.resolve.outputs.version }}" ]; then
            echo "::error::tag says ${{ steps.resolve.outputs.version }}, pyproject.toml says $DECLARED"
            exit 1
          fi

      - name: The changelog must have notes for it
        run: python scripts/release_notes.py "${{ steps.resolve.outputs.version }}" --output /dev/null

  # ---------------------------------------------------------------- build ---
  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ---------------------------------------------------------------- smoke ---
  # CI tests the repository. This tests the artefact -- the thing users actually
  # install, which is not the same object and can differ from it (a missing
  # package-data glob ships a wheel with no templates and a green test suite).
  smoke:
    needs: [guard, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the wheel into an empty environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl

      - name: It reports the version it was tagged with
        run: |
          GOT=$(/tmp/smoke/bin/python -c "import pysuricata;print(pysuricata.__version__)")
          if [ "$GOT" != "${{ needs.guard.outputs.version }}" ]; then
            echo "::error::wheel reports $GOT, tag says ${{ needs.guard.outputs.version }}"
            exit 1
          fi

      - name: It profiles a frame and keeps its contract
        run: |
          /tmp/smoke/bin/pip install pandas numpy
          /tmp/smoke/bin/python - <<'PY'
          import pandas as pd, numpy as np
          from pysuricata import profile, summarize
          rng = np.random.default_rng(0)
          frame = pd.DataFrame({
              "num": rng.normal(0, 1, 500),
              "cat": rng.choice(list("abc"), 500),
              "when": pd.date_range("2026-01-01", periods=500, freq="h"),
              "flag": rng.integers(0, 2, 500).astype(bool),
          })
          html = profile(frame, seed=0).html
          assert len(html) > 100_000, f"suspiciously small report: {len(html)} bytes"
          # The templates and stylesheets travel in the wheel or they do not.
          assert "vstat-row" in html, "no card markup -- package data missing?"
          assert "<style" in html, "no inlined CSS -- package data missing?"
          payload = summarize(frame, seed=0)
          assert "schema_version" in payload, "summarize() lost its contract"
          print("smoke ok:", len(html), "bytes, schema", payload["schema_version"])
          PY

  # -------------------------------------------------------------- publish ---
  # Trusted Publishing over OIDC: no long-lived credential in the repository.
  #
  # The `pypi` environment carries NO protection rules. It used to require a
  # reviewer, and this comment used to say so; that rule was removed, so there
  # is no human confirmation between a pushed tag and a published package.
  #
  # The consequence is worth stating where it will be read: `git push origin
  # vX.Y.Z` is the point of no return. A version on PyPI cannot be replaced,
  # only yanked, and a yanked version keeps its number forever. `guard` and
  # `smoke` are what stand in for the reviewer now -- they check the tag
  # against pyproject.toml, require changelog notes, and install the built
  # wheel on 3.10 and 3.14 before this job runs.
  #
  # To restore the gate: repository Settings -> Environments -> pypi ->
  # Required reviewers.
  publish:
    needs: [guard, build, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pysuricata
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ---------------------------------------------------------------- demo ---
  # `worker.js` installs `pysuricata==<latest>` from PyPI at page load, so
  # every publish above edits the demo's launch asset in production -- and
  # until this job existed, nothing tested that edit before real visitors did.
  #
  # DOM presence would not have caught the one failure this project already
  # found this way: Chrome silently drops a large `srcdoc` document, no error,
  # no console warning, no failed request, just a blank frame that looks
  # identical to a rendered one in the markup. `web/e2e.py` asserts on the
  # screenshot's actual pixels instead (#1).
  #
  # Targets the live site, not a local checkout of `web/`: Cloudflare Pages
  # redeploys on push to `main` on its own schedule, so a local copy can be
  # ahead or behind what a visitor is actually served, and the live URL is the
  # only thing that answers "does this work right now."
  #
  # Deliberately not a dependency of `release` below. PyPI already has the
  # package by the time this runs, and nothing can take that back -- gating
  # the GitHub release on this would make the release notes late for a reason
  # that has nothing to do with whether they are accurate. A failure here
  # fails the workflow on its own, which is the signal to stop tagging further
  # releases until the demo is fixed (docs/versioning.md).
  demo-check:
    # `guard` as well as `publish`, for the version it resolved: this job both
    # waits for that version to appear on PyPI and asserts the demo loaded it.
    needs: [publish, guard]
    runs-on: ubuntu-latest
    # The default is six hours, and this job can hang. On the 0.2.0 release it
    # sat in `playwright install --with-deps chromium` for the best part of an
    # hour with nothing to show for it, holding the whole workflow open long
    # after PyPI and the GitHub release were both done. Nothing here should
    # take more than a few minutes past the twenty-minute index wait below, so
    # a run that reaches this bound has stopped making progress.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --group browser

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      # Without this the job checks the demo at the one moment the demo is
      # guaranteed not to have the release yet, and calls that a demo failure.
      #
      # `needs: publish` means this starts seconds after upload. PyPI's JSON
      # API -- which is what micropip resolves against -- is served
      # `cache-control: max-age=900`, so for up to fifteen minutes an edge can
      # still be answering with a copy that predates the release. That is not a
      # guess: when 0.2.0 was published the demo logged `newest pysuricata is
      # 0.2.0` (its own query sets `no-store`) and then `0.2.0 would not
      # install here`, and served 0.1.5 until the window expired. The demo was
      # fine, the release was fine, and this job would have failed both.
      #
      # So wait for the index micropip will actually read to agree, and give up
      # after twenty minutes -- past the window, so a timeout here means
      # something is really wrong rather than merely early.
      - name: Wait for PyPI's index to serve the published version
        run: |
          VERSION="${{ needs.guard.outputs.version }}"
          DEADLINE=$(( SECONDS + 1200 ))
          until [ "$SECONDS" -ge "$DEADLINE" ]; do
            SEEN=$(curl -fsS "https://pypi.org/pypi/pysuricata/json" \
                   | python -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" \
                   || echo "")
            if [ "$SEEN" = "$VERSION" ]; then
              echo "PyPI is serving $VERSION after ${SECONDS}s"
              exit 0
            fi
            echo "PyPI still serving ${SEEN:-<unreadable>}, waiting for $VERSION"
            sleep 30
          done
          echo "::error::PyPI did not serve $VERSION within 20 minutes"
          exit 1

      - name: The live demo renders a visible report on the version just published
        run: |
          uv run python web/e2e.py \
            --url https://pysuricata.pages.dev \
            --out e2e-out \
            --expect-version "${{ needs.guard.outputs.version }}"

      - name: Upload the report screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-e2e-screenshot
          path: e2e-out/
          if-no-files-found: warn

  # -------------------------------------------------------------- release ---
  # Last, and after publish, so a GitHub release never announces a version PyPI
  # does not have. These two used to run in parallel with no `needs:` between
  # them, so PyPI could receive a package whose tag step had failed.
  release:
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Notes, from the changelog you already enforce
        run: python scripts/release_notes.py "${{ needs.guard.outputs.version }}" --output notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "v${{ needs.guard.outputs.version }}" \
            --notes-file notes.md \
            dist/*
